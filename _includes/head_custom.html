<style>
  /* ─────────────────────────────────────────────────────────────────
     NAVY / RED / WHITE COLOR SCHEME
     Setting on `body` (not :root) wins via DOM inheritance proximity:
     every visible element is a child of body, so it sees body's value
     before it ever reaches :root — no !important or cascade order needed.
  ──────────────────────────────────────────────────────────────────── */
  body {
    --global-theme-color:       #1b2a4a;
    --global-hover-color:       #c41230;
    --global-hover-text-color:  #ffffff;
    --global-highlight-color:   #c41230;
    --global-footer-bg-color:   #1b2a4a;
    --global-footer-text-color: #e8e8e8;
    --global-footer-link-color: #ffffff;
  }

  /* Belt-and-suspenders: direct property overrides for the most visible elements */
  a,
  table.table a {
    color: #1b2a4a !important;
  }
  a:hover,
  table.table a:hover,
  .navbar.navbar-light .navbar-nav .nav-item .nav-link:hover,
  footer.fixed-bottom a:hover {
    color: #c41230 !important;
  }
  footer.fixed-bottom {
    background-color: #1b2a4a !important;
  }
  footer.fixed-bottom .container {
    color: #e8e8e8 !important;
  }
  footer.fixed-bottom a {
    color: #ffffff !important;
  }
  .navbar.navbar-light .navbar-nav .nav-item.active > .nav-link {
    color: #1b2a4a !important;
  }
  .cv .card .list-group-item .badge {
    background-color: #1b2a4a !important;
  }

  /* ─────────────────────────────────────────────────────────────────
     PROFILE NAME: make "Rohan" and "Shah" the same bold weight.
     "Rohan" is in <span class="font-weight-bold">; "Shah" is a bare
     text node in h1. Setting font-weight on h1 makes Shah inherit it.
  ──────────────────────────────────────────────────────────────────── */
  html body h1.post-title,
  html body h1.post-title span,
  html body h1.post-title * {
    font-weight: 700 !important;
  }

  /* ─────────────────────────────────────────────────────────────────
     CAPITALIZE headings ("selected publications" → "Selected Publications")
  ──────────────────────────────────────────────────────────────────── */
  html h2,
  html h2 a,
  html h2 span,
  html h3,
  html h3 a,
  html .card-title {
    text-transform: capitalize !important;
  }

  /* ─────────────────────────────────────────────────────────────────
     PUBLICATION LAYOUT fixes
  ──────────────────────────────────────────────────────────────────── */
  .publications .abbr-col,
  .publications .preview-col {
    display: none !important;
  }
  .publications .main-col {
    max-width: 100% !important;
    flex: 0 0 100% !important;
  }
  ol.bibliography li {
    font-size: 1rem !important;
    line-height: 1.65 !important;
  }
  ol.bibliography li .title {
    font-size: 1.05rem !important;
    font-weight: 600 !important;
  }
  ol.bibliography li .author {
    font-size: 0.95rem !important;
  }
  ol.bibliography li .periodical {
    font-size: 0.95rem !important;
  }

  /* ─────────────────────────────────────────────────────────────────
     CV LAYOUT: remove bullet dots and entry borders
  ──────────────────────────────────────────────────────────────────── */
  .cv ul.list-group > li {
    list-style-type: none !important;
  }
  .cv ul.list-group > li::marker {
    content: "" !important;
  }
  .cv .list-group-item {
    border: none !important;
    border-top: 1px solid rgba(0, 0, 0, 0.06) !important;
  }
  .cv .list-group-item:first-child {
    border-top: none !important;
  }
  .cv .table-cv td {
    border: none !important;
  }
  .cv .date-column {
    vertical-align: top !important;
  }
</style>
